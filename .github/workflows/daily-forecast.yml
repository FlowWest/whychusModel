name: Daily Temperature Forecast
on:
  schedule:
    - cron: '0 3 * * *'   # 8 PM Pacific during PDT (summer)
    - cron: '0 4 * * *'   # 8 PM Pacific during PST (winter)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if today's forecast already ran
        id: check_dedupe
        run: |
          today=$(TZ='America/Los_Angeles' date +%F)
          log_file="output/instream-forecast-log.csv"
          if [ -f "$log_file" ] && grep -q "^$today," "$log_file"; then
            echo "Forecast for $today already logged — skipping duplicate run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No forecast for $today yet — proceeding with today's date: $today"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up R
        if: steps.check_dedupe.outputs.skip == 'false'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install system libraries
        if: steps.check_dedupe.outputs.skip == 'false'
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install pak
        if: steps.check_dedupe.outputs.skip == 'false'
        run: Rscript -e 'install.packages("pak", repos = "https://cloud.r-project.org")'
      - name: Cache R packages
        if: steps.check_dedupe.outputs.skip == 'false'
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.R_LIBS_USER }}
          key: r-4.4-pkgs-v3-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-4.4-pkgs-v3-
      - name: Install dependencies
        if: steps.check_dedupe.outputs.skip == 'false'
        run: |
          Rscript -e '
            pak::pak(c(
              "tidyverse", "lubridate", "randomForest", "zoo",
              "httr", "httr2", "rvest", "janitor", "readr", "here"
            ))
          '
      - name: Install whychusModel package
        if: steps.check_dedupe.outputs.skip == 'false'
        run: Rscript -e 'pak::local_install(upgrade = FALSE)'
      - name: Verify package installs
        if: steps.check_dedupe.outputs.skip == 'false'
        run: |
          Rscript -e '
            cat("Library paths:\n")
            print(.libPaths())
            cat("\nChecking key packages:\n")
            pkgs <- c("tidyverse", "randomForest", "whychusModel")
            for (p in pkgs) {
              cat(p, ":", system.file(package = p) != "", "\n")
            }
          '
      - name: Debug OWRD connectivity
        if: steps.check_dedupe.outputs.skip == 'false'
        run: |
          echo "Testing OWRD connectivity from GitHub Actions runner..."
          curl -v -A "Mozilla/5.0" \
            "https://apps.wrd.state.or.us/apps/sw/hydro_near_real_time/" \
            -o /dev/null -w "\nHTTP status: %{http_code}\n" || true

      - name: Run daily forecast
        if: steps.check_dedupe.outputs.skip == 'false'
        run: Rscript analysis/run-daily-forecast.R
      - name: Commit and push forecast log
        if: steps.check_dedupe.outputs.skip == 'false' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          git add output/
          git diff --staged --quiet || git commit -m "chore: forecast log $(date -u +%Y-%m-%d)"
          git push