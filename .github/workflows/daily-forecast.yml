name: Daily Temperature Forecast

on:
  schedule:
    - cron: '0 3 * * *'   # 8:00 PM PDT (UTC-7); shift to '0 4 * * *' in winter (PST)
  workflow_dispatch:       # allow manual trigger from the Actions tab

permissions:
  contents: write          # needed to push forecast-log.csv back to the repo

jobs:
  forecast:
    runs-on: ubuntu-latest

    env:
      R_LIBS_USER: /home/runner/R/library   # single consistent library path

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: /home/runner/R/library
          key: r-4.4-pkgs-v2
          restore-keys: r-4.4-

      - name: Install system libraries
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Create R library directory
        run: mkdir -p /home/runner/R/library

      - name: Install R packages
        run: |
          Rscript -e '
            lib <- Sys.getenv("R_LIBS_USER")
            .libPaths(c(lib, .libPaths()))
            pkgs <- c("tidyverse", "lubridate", "randomForest", "zoo",
                      "httr", "httr2", "rvest", "janitor", "readr", "here")
            missing_pkgs <- pkgs[!pkgs %in% rownames(installed.packages())]
            if (length(missing_pkgs) > 0)
              install.packages(missing_pkgs,
                               repos = "https://cloud.r-project.org",
                               lib   = lib)
          '

      - name: Install whychusModel package
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))'
          R CMD INSTALL --library=/home/runner/R/library .

      - name: Run daily forecast
        run: |
          Rscript -e '
            .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
            source("analysis/run-daily-forecast.R")
          '

      - name: Commit and push forecast log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/forecast-log.csv
          git diff --staged --quiet || git commit -m "chore: forecast log $(date -u +%Y-%m-%d)"
          git push