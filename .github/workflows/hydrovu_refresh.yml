name: HydroVu Daily Refresh
on:
  schedule:
    # 7:XXam Pacific = 14:XX UTC (standard), 15:XX UTC (DST)
    # Run twice; job checks the PT hour and skips the other run
    - cron: '10 14 * * *'
    - cron: '10 15 * * *'
  workflow_dispatch:
# Data is pushed to the whychusData repo with WHYCHUS_DATA_TOKEN, so this
# repo only needs read access
permissions:
  contents: read
concurrency:
  group: hydrovu-pull-lock
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # whychusData is checked out inside the workspace; see scripts/hydrovu_config.R
      WHYCHUS_DATA_DIR: ${{ github.workspace }}/whychusData/data
    steps:
      - name: Check schedule against time zone
        id: ptcheck
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ='America/Los_Angeles' date +%H)" = "07" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Not 7am Pacific — skipping this scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        if: steps.ptcheck.outputs.skip == 'false'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout whychusData
        if: steps.ptcheck.outputs.skip == 'false'
        uses: actions/checkout@v6
        with:
          repository: FlowWest/whychusData
          ref: main
          path: whychusData
          token: ${{ secrets.WHYCHUS_DATA_TOKEN }}
      - name: Set up R
        if: steps.ptcheck.outputs.skip == 'false'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install system libraries
        if: steps.ptcheck.outputs.skip == 'false'
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install pak
        if: steps.ptcheck.outputs.skip == 'false'
        run: Rscript -e 'install.packages("pak", repos = "https://cloud.r-project.org")'
      - name: Cache R packages
        if: steps.ptcheck.outputs.skip == 'false'
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.R_LIBS_USER }}
          key: r-4.4-hydrovu-v1-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-4.4-hydrovu-v1-
      - name: Install dependencies
        if: steps.ptcheck.outputs.skip == 'false'
        run: |
          Rscript -e '
            pak::pak(c(
              "FlowWest/rhydrovu", "dplyr", "tibble", "lubridate", "here"
            ))
          '
      - name: Fetch HydroVu data
        if: steps.ptcheck.outputs.skip == 'false'
        env:
          HYDROVU_CLIENT_ID: ${{ secrets.HYDROVU_CLIENT_ID }}
          HYDROVU_CLIENT_SECRET: ${{ secrets.HYDROVU_CLIENT_SECRET }}
        run: Rscript scripts/fetch_hydrovu.R
      - name: Commit and push to whychusData
        if: steps.ptcheck.outputs.skip == 'false'
        working-directory: whychusData
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hv_data.csv
          git diff --staged --quiet && { echo "No new HydroVu data."; exit 0; }
          git commit -m "chore: hydrovu data $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
