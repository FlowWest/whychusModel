name: HydroVu Daily Refresh

on:
  schedule:
    # 7:XXam Pacific = 14:XX UTC (standard), 15:XX UTC (DST)
    # Run twice; script enforces PT time window
    - cron: "10 14 * * *"
    - cron: "10 15 * * *"
  workflow_dispatch:

# Data is committed to the whychusData repo with WHYCHUS_DATA_TOKEN, so this
# repo only needs read access
permissions:
  contents: read

concurrency:
  group: hydrovu-pull-lock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: hydrovu

    steps:
      - name: Check schedule against time zone
        id: ptcheck
        if: github.event_name == 'schedule'
        run: |
          PT_HOUR=$(TZ=America/Los_Angeles date +'%H')

          if [ "$PT_HOUR" = "07" ]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
          else
            echo "run_job=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if not correct scheduled time
        if: github.event_name == 'schedule' && steps.ptcheck.outputs.run_job != 'true'
        run: |
          echo "Not at the schedule time in PT. Skipping scheduled run."
          exit 0

      # Code and data are checked out side by side, matching the local layout
      # that scripts/hydrovu_config.R expects (../whychusData/data)
      - name: Checkout code
        if: github.event_name != 'schedule' || steps.ptcheck.outputs.run_job == 'true'
        uses: actions/checkout@v4
        with:
          path: whychusModel

      - name: Checkout data repo
        if: github.event_name != 'schedule' || steps.ptcheck.outputs.run_job == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/whychusData
          ref: main
          path: whychusData
          token: ${{ secrets.WHYCHUS_DATA_TOKEN }}
          persist-credentials: true

      - name: Set up R
        if: github.event_name != 'schedule' || steps.ptcheck.outputs.run_job == 'true'
        uses: r-lib/actions/setup-r@v2

      - name: Install system deps
        if: github.event_name != 'schedule' || steps.ptcheck.outputs.run_job == 'true'
        run: sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R packages
        if: github.event_name != 'schedule' || steps.ptcheck.outputs.run_job == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: whychusModel
          packages: |
            github::FlowWest/rhydrovu
            here
            dplyr
            tibble
            lubridate

      - name: Fetch HydroVu data
        if: github.event_name != 'schedule' || steps.ptcheck.outputs.run_job == 'true'
        working-directory: whychusModel
        env:
          HYDROVU_CLIENT_ID: ${{ secrets.HYDROVU_CLIENT_ID }}
          HYDROVU_CLIENT_SECRET: ${{ secrets.HYDROVU_CLIENT_SECRET }}
        run: |
          Rscript scripts/fetch_hydrovu.R

      - name: Commit updated data
        if: github.event_name != 'schedule' || steps.ptcheck.outputs.run_job == 'true'
        working-directory: whychusData
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/hv_data.csv
          git commit -m "HydroVu refresh" || { echo "No changes"; exit 0; }

          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $i/5) - rebasing onto latest main and retrying"
            git pull --rebase origin main
          done
          exit 1
